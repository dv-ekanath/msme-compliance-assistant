services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: msme-compliance-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-msme_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-msme_compliance}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-msme_admin} -d ${POSTGRES_DB:-msme_compliance}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
